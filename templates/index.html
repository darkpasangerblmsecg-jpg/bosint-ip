<!DOCTYPE html>
<html lang="tr" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BosINT v4.4-PRO - Intelligence Suite</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS (Harita için) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- Google Fonts: Share Tech Mono & JetBrains Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bs-body-font-family: 'JetBrains Mono', monospace;
            --font-tech: 'Share Tech Mono', monospace;
        }
        body {
            font-family: var(--bs-body-font-family);
            background-color: #0b0f19;
            color: #e2e8f0;
        }
        .font-tech {
            font-family: var(--font-tech);
        }
        .navbar-custom {
            background-color: #0f172a;
            border-bottom: 1px solid #1e293b;
        }
        .card {
            background-color: #111827;
            border: 1px solid #1f2937;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
        }
        .form-control {
            background-color: #030712;
            border: 1px solid #374151;
            color: #f3f4f6;
        }
        .form-control:focus {
            background-color: #030712;
            color: #ffffff;
            border-color: #06b6d4;
            box-shadow: 0 0 12px rgba(6, 182, 212, 0.25);
        }
        .result-card {
            background-color: #0f172a;
            border: 1px solid #1e293b;
            transition: all 0.25s ease-in-out;
        }
        .result-card:hover {
            border-color: #06b6d4;
            transform: translateY(-2px);
        }
        #map {
            height: 250px;
            width: 100%;
            border-radius: 6px;
            z-index: 1;
        }
        /* Leaflet koyu tema harita uyumu */
        .leaflet-layer, .leaflet-control-zoom-in, .leaflet-control-zoom-out, .leaflet-attribution-flag {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }
    </style>
</head>
<body>

    <!-- Top Navbar -->
    <nav class="navbar navbar-expand navbar-custom px-4 py-2">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                <div class="bg-info bg-opacity-10 border border-info border-opacity-50 p-2 rounded text-info d-flex align-items-center justify-content-center" style="width: 36px; height: 36px;">
                    <i class="fa-solid fa-terminal fa-sm"></i>
                </div>
                <span class="fw-bold font-tech fs-4 tracking-wider text-info">BosINT</span>
                <span class="badge bg-info bg-opacity-10 text-info border border-info border-opacity-25" style="font-size: 10px;">v4.4-PRO</span>
            </a>
            <div class="d-flex align-items-center gap-3">
                <span class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25 py-2 px-3 d-none d-md-inline-block">
                    <i class="fa-solid fa-circle fa-2xs me-1"></i> SYS_STATUS: ONLINE
                </span>
                <button id="themeToggle" class="btn btn-sm btn-outline-secondary border-secondary text-info">
                    <i class="fa-solid fa-code"></i>
                </button>
                <button id="myIpLookupBtn" class="btn btn-sm btn-info text-dark fw-bold">
                    <i class="fa-solid fa-user-shield me-1"></i> My IP Lookup
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container-fluid p-4">
        <div class="row g-4">
            
            <!-- Left Panel / Controls -->
            <div class="col-lg-4">
                <!-- Navigation Tabs -->
                <div class="card p-3 mb-4">
                    <div class="d-flex gap-2 mb-3">
                        <button id="tabUsername" class="btn btn-sm btn-outline-secondary text-secondary border-0 flex-fill"><i class="fa-solid fa-user-secret me-1"></i> User</button>
                        <button id="tabIp" class="btn btn-sm btn-outline-secondary text-secondary border-0 flex-fill"><i class="fa-solid fa-network-wired me-1"></i> IP</button>
                        <button id="tabDomain" class="btn btn-sm btn-outline-secondary text-secondary border-0 flex-fill"><i class="fa-solid fa-globe me-1"></i> Domain</button>
                        <button id="tabPhone" class="btn btn-sm btn-info text-dark fw-bold flex-fill"><i class="fa-solid fa-phone me-1"></i> Phone</button>
                    </div>

                    <!-- Input Alanı -->
                    <div id="inputSection">
                        <label class="form-label small text-muted" id="inputLabel">TARGET PHONE NUMBER</label>
                        <div class="input-group mb-3">
                            <input type="text" id="targetInput" class="form-control" value="+905554443322">
                            <button class="btn btn-outline-secondary text-info" type="button" onclick="document.getElementById('targetInput').value=''"><i class="fa-regular fa-copy"></i></button>
                        </div>
                        <button id="actionBtn" class="btn btn-info text-dark w-100 fw-bold py-2">
                            <i class="fa-solid fa-magnifying-glass me-2"></i>Run Lookup
                        </button>
                    </div>
                </div>

                <!-- Query History -->
                <div class="card p-3">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="small text-muted"><i class="fa-solid fa-clock-rotate-left me-1"></i> QUERY HISTORY</span>
                        <i class="fa-solid fa-trash-can text-muted" style="cursor: pointer; font-size: 12px;" onclick="document.getElementById('historyBox').innerHTML=''"></i>
                    </div>
                    <div id="historyBox">
                        <div class="d-flex justify-content-between align-items-center p-2 rounded mb-2" style="background-color: #030712;">
                            <span class="text-info small"><i class="fa-solid fa-chevron-right fa-2xs me-2"></i>Terminal Initialized</span>
                            <i class="fa-solid fa-check text-success" style="font-size: 12px;"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Panel / Results -->
            <div class="col-lg-8">
                <div class="card p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div>
                            <span class="small text-muted d-block mb-1 font-tech" id="resultHeaderType">INTELLIGENCE RESULTS</span>
                            <h3 class="fw-bold text-info m-0" id="resultTitle">System Ready</h3>
                        </div>
                        <span class="badge bg-info bg-opacity-10 text-info border border-info border-opacity-25 px-3 py-2">
                            Durum: <span id="resultCount">Aktif</span>
                        </span>
                    </div>

                    <hr class="border-secondary opacity-25 mb-4">

                    <!-- Results Grid -->
                    <div class="row g-3" id="resultsGrid">
                        <div class="col-12 text-center py-5 text-muted">
                            <i class="fa-solid fa-terminal fa-2x mb-2 text-info"></i>
                            <p>Sol menüden hedef modülü seçip operasyonu başlatın.</p>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Leaflet JS (Harita için) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        let currentMode = 'phone';
        let mapInstance = null;

        function setActiveTab(activeBtnId) {
            ['tabUsername', 'tabIp', 'tabDomain', 'tabPhone'].forEach(id => {
                const btn = document.getElementById(id);
                if (id === activeBtnId) {
                    btn.className = 'btn btn-sm btn-info text-dark fw-bold flex-fill';
                } else {
                    btn.className = 'btn btn-sm btn-outline-secondary text-secondary border-0 flex-fill';
                }
            });
        }

        document.getElementById('tabUsername').addEventListener('click', () => {
            currentMode = 'username';
            setActiveTab('tabUsername');
            document.getElementById('inputLabel').innerText = 'TARGET USERNAME';
            document.getElementById('targetInput').placeholder = 'Kullanıcı adı girin...';
            document.getElementById('targetInput').value = 'emocxn';
            document.getElementById('actionBtn').innerHTML = '<i class="fa-solid fa-fingerprint me-2"></i>Run Username Scan';
        });

        document.getElementById('tabIp').addEventListener('click', () => {
            currentMode = 'ip';
            setActiveTab('tabIp');
            document.getElementById('inputLabel').innerText = 'TARGET IP ADDRESS';
            document.getElementById('targetInput').placeholder = "Örn: 8.8.8.8 (Boş bırakırsanız kendi IP'niz)";
            document.getElementById('targetInput').value = '';
            document.getElementById('actionBtn').innerHTML = '<i class="fa-solid fa-network-wired me-2"></i>Run IP Lookup';
        });

        document.getElementById('tabDomain').addEventListener('click', () => {
            currentMode = 'domain';
            setActiveTab('tabDomain');
            document.getElementById('inputLabel').innerText = 'TARGET DOMAIN';
            document.getElementById('targetInput').placeholder = 'Örn: google.com';
            document.getElementById('targetInput').value = 'google.com';
            document.getElementById('actionBtn').innerHTML = '<i class="fa-solid fa-globe me-2"></i>Run Domain Lookup';
        });

        document.getElementById('tabPhone').addEventListener('click', () => {
            currentMode = 'phone';
            setActiveTab('tabPhone');
            document.getElementById('inputLabel').innerText = 'TARGET PHONE NUMBER';
            document.getElementById('targetInput').placeholder = 'Örn: +905554443322';
            document.getElementById('targetInput').value = '+905554443322';
            document.getElementById('actionBtn').innerHTML = '<i class="fa-solid fa-magnifying-glass me-2"></i>Run Phone Lookup';
        });

        document.getElementById('myIpLookupBtn').addEventListener('click', () => {
            document.getElementById('tabIp').click();
            document.getElementById('targetInput').value = '';
            document.getElementById('actionBtn').click();
        });

        document.getElementById('actionBtn').addEventListener('click', async () => {
            const val = document.getElementById('targetInput').value.trim();
            const grid = document.getElementById('resultsGrid');
            const title = document.getElementById('resultTitle');
            const countBadge = document.getElementById('resultCount');
            const headerType = document.getElementById('resultHeaderType');

            // Eğer önceki aramadan kalan bir harita varsa yok et
            if (mapInstance) {
                mapInstance.remove();
                mapInstance = null;
            }

            // 1. PHONE MODU
            if (currentMode === 'phone') {
                if (!val) return;
                title.innerText = val;
                headerType.innerText = 'PHONE INTELLIGENCE RESULTS';
                grid.innerHTML = '<div class="col-12 text-center py-5 text-info"><i class="fa-solid fa-spinner fa-spin me-2"></i>Global Telekom Veritabanı Taranıyor...</div>';

                try {
                    const response = await fetch(`/search-phone?phone=${encodeURIComponent(val)}`);
                    const data = await response.json();

                    if (data.found) {
                        countBadge.innerText = 'Analiz Başarılı';
                        grid.innerHTML = `
                            <div class="col-md-6">
                                <div class="result-card p-3 rounded h-100">
                                    <span class="text-muted small d-block">Uluslararası Format</span>
                                    <strong class="text-info">${data.phone}</strong>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="result-card p-3 rounded h-100">
                                    <span class="text-muted small d-block">Abone Durumu</span>
                                    <strong class="text-warning">${data.full_name}</strong>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="result-card p-3 rounded h-100">
                                    <span class="text-muted small d-block">Operatör</span>
                                    <strong class="text-white">${data.operator}</strong>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="result-card p-3 rounded h-100">
                                    <span class="text-muted small d-block">Hat Tipi</span>
                                    <strong class="text-white">${data.line_type}</strong>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="result-card p-3 rounded h-100">
                                    <span class="text-muted small d-block">Bölge / Konum</span>
                                    <strong class="text-white">${data.location}</strong>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="result-card p-3 rounded h-100">
                                    <span class="text-muted small d-block">Zaman Dilimi</span>
                                    <strong class="text-white">${data.timezone}</strong>
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="result-card p-3 rounded">
                                    <span class="text-muted small d-block">Motor Kaynağı</span>
                                    <strong class="text-success">${data.source}</strong>
                                </div>
                            </div>
                        `;
                    } else {
                        countBadge.innerText = 'Geçersiz Numara';
                        grid.innerHTML = `<div class="col-12"><div class="result-card p-4 rounded text-center text-muted"><i class="fa-solid fa-circle-exclamation fa-2x mb-2 text-warning"></i><p class="mb-0">${data.message}</p></div></div>`;
                    }
                } catch (err) {
                    grid.innerHTML = '<div class="col-12 text-center py-4 text-danger">Sunucu bağlantı hatası!</div>';
                }
            } 
            
            // 2. IP MODU (GEOLOKASYON + HARİTA)
            else if (currentMode === 'ip') {
                title.innerText = val || 'Kendi IP Adresiniz';
                headerType.innerText = 'IP INTELLIGENCE & GEOLOCATION RESULTS';
                grid.innerHTML = '<div class="col-12 text-center py-5 text-info"><i class="fa-solid fa-spinner fa-spin me-2"></i>IP Geolokasyon Bilgileri Çekiliyor...</div>';

                try {
                    const targetUrl = val ? `https://ipwho.is/${val}` : `https://ipwho.is/`;
                    const response = await fetch(targetUrl);
                    const data = await response.json();

                    if (data.success) {
                        countBadge.innerText = 'Konum Saptandı';
                        grid.innerHTML = `
                            <div class="col-md-6">
                                <div class="result-card p-3 rounded h-100">
                                    <span class="text-muted small d-block">IP Adresi & Tür</span>
                                    <strong class="text-info">${data.ip} (${data.type})</strong>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="result-card p-3 rounded h-100">
                                    <span class="text-muted small d-block">Ülke / Şehir</span>
                                    <strong class="text-white">${data.country} (${data.country_code}), ${data.city}</strong>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="result-card p-3 rounded h-100">
                                    <span class="text-muted small d-block">ISS (Internet Service Provider)</span>
                                    <strong class="text-warning">${data.connection.isp}</strong>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="result-card p-3 rounded h-100">
                                    <span class="text-muted small d-block">Koordinatlar</span>
                                    <strong class="text-white">Lat: ${data.latitude}, Lon: ${data.longitude}</strong>
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="result-card p-3 rounded">
                                    <span class="text-muted small d-block mb-2"><i class="fa-solid fa-map-location-dot me-1"></i>Canlı Harita Konumu</span>
                                    <div id="map"></div>
                                </div>
                            </div>
                        `;

                        // Haritayı başlat ve hedef koordinata pin at
                        setTimeout(() => {
                            mapInstance = L.map('map').setView([data.latitude, data.longitude], 10);
                            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                                maxZoom: 19,
                                attribution: '&copy; OpenStreetMap'
                            }).addTo(mapInstance);

                            L.marker([data.latitude, data.longitude]).addTo(mapInstance)
                                .bindPopup(`<b>${data.ip}</b><br>${data.city}, ${data.country}`)
                                .openPopup();
                        }, 200);

                    } else {
                        countBadge.innerText = 'Hata';
                        grid.innerHTML = `<div class="col-12 text-center py-4 text-danger">Hata: ${data.message}</div>`;
                    }
                } catch (err) {
                    grid.innerHTML = '<div class="col-12 text-center py-4 text-danger">IP Servisine ulaşılamadı.</div>';
                }
            } 
            
            // 3. DOMAIN MODU
            else if (currentMode === 'domain') {
                if (!val) return;
                title.innerText = val;
                headerType.innerText = 'DOMAIN INTELLIGENCE RESULTS';
                grid.innerHTML = '<div class="col-12 text-center py-5 text-info"><i class="fa-solid fa-spinner fa-spin me-2"></i>DNS Kayıtları Çözümleniyor...</div>';

                try {
                    const response = await fetch(`https://dns.google/resolve?name=${val}&type=A`);
                    const data = await response.json();

                    let recordsHtml = '';
                    if (data.Answer) {
                        data.Answer.forEach(rec => {
                            recordsHtml += `<p class="mb-1"><strong>Kayıt Tipi (${rec.type}):</strong> <span class="text-info">${rec.data}</span> (TTL: ${rec.TTL})</p>`;
                        });
                    } else {
                        recordsHtml = '<p class="text-muted">A kayıt bulunamadı.</p>';
                    }

                    countBadge.innerText = data.Answer ? data.Answer.length + ' Kayıt' : '0 Kayıt';
                    grid.innerHTML = `
                        <div class="col-12">
                            <div class="result-card p-4 rounded">
                                <h5 class="text-info mb-3"><i class="fa-solid fa-globe me-2"></i>DNS / A Kayıtları (${val})</h5>
                                <p class="mb-2"><strong>Sorgu Durumu:</strong> ${data.Status === 0 ? '<span class="text-success">NOERROR (Başarılı)</span>' : 'Error'}</p>
                                <hr class="border-secondary opacity-25">
                                <div class="mt-3">
                                    <h6 class="text-muted small mb-2">IP Çözümlemeleri:</h6>
                                    ${recordsHtml}
                                </div>
                                <div class="mt-4">
                                    <a href="https://who.is/whois/${val}" target="_blank" class="btn btn-sm btn-outline-info">
                                        <i class="fa-solid fa-external-link-alt me-1"></i> Whois Raporunu Aç
                                    </a>
                                </div>
                            </div>
                        </div>
                    `;
                } catch (err) {
                    grid.innerHTML = '<div class="col-12 text-center py-4 text-danger">Domain servisine ulaşılamadı.</div>';
                }
            } 
            
            // 4. USERNAME MODU
            else if (currentMode === 'username') {
                if (!val) return;
                title.innerText = val;
                headerType.innerText = 'USERNAME SCAN RESULTS';
                grid.innerHTML = '<div class="col-12 text-center py-5 text-info"><i class="fa-solid fa-spinner fa-spin me-2"></i>Sosyal Ağlar Taranıyor...</div>';

                try {
                    const response = await fetch(`/search?username=${encodeURIComponent(val)}`);
                    const data = await response.json();
                    if (data.found_sites) {
                        grid.innerHTML = '';
                        const entries = Object.entries(data.found_sites);
                        countBadge.innerText = entries.length + ' Sonuç';

                        if (entries.length === 0) {
                            grid.innerHTML = '<div class="col-12 text-center py-4 text-muted">Hiçbir platformda eşleşme bulunamadı.</div>';
                            return;
                        }

                        entries.forEach(([platform, url]) => {
                            grid.innerHTML += `
                                <div class="col-md-6">
                                    <div class="result-card p-3 rounded position-relative h-100">
                                        <div class="d-flex justify-content-between align-items-start mb-2">
                                            <span class="fw-bold small text-info"><i class="fa-solid fa-globe me-1"></i> ${platform.toUpperCase()}</span>
                                            <a href="${url}" target="_blank" class="btn btn-sm btn-outline-info py-0 px-2" style="font-size: 11px;">Open</a>
                                        </div>
                                        <span class="d-block text-white mb-1" style="font-size: 13px;">${val}</span>
                                        <span class="text-muted text-truncate d-block" style="font-size: 11px;">${url}</span>
                                    </div>
                                </div>
                            `;
                        });
                    }
                } catch (err) {
                    grid.innerHTML = '<div class="col-12 text-center py-4 text-danger">API Bağlantı Hatası!</div>';
                }
            }
        });
    </script>
</body>
</html>
