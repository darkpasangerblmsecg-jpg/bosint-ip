<!DOCTYPE html>
<html lang="tr" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus OSINT v4.7-PRO - Advanced Intelligence Suite</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Leaflet CSS (Harita için) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bs-body-font-family: 'JetBrains Mono', monospace;
            --font-tech: 'Share Tech Mono', monospace;
        }
        body {
            font-family: var(--bs-body-font-family);
            background-color: #0b0f19;
            color: #e2e8f0;
        }
        .font-tech {
            font-family: var(--font-tech);
        }
        .navbar-custom {
            background-color: #0f172a;
            border-bottom: 1px solid #1e293b;
        }
        .card {
            background-color: #111827;
            border: 1px solid #1f2937;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }
        .form-control, .form-select {
            background-color: #030712;
            border: 1px solid #374151;
            color: #f3f4f6;
        }
        .form-control:focus, .form-select:focus {
            background-color: #030712;
            color: #ffffff;
            border-color: #06b6d4;
            box-shadow: 0 0 12px rgba(6, 182, 212, 0.25);
        }
        .result-card {
            background-color: #0f172a;
            border: 1px solid #1e293b;
            transition: all 0.25s ease-in-out;
        }
        .result-card:hover {
            border-color: #06b6d4;
            transform: translateY(-2px);
        }
        #map {
            height: 250px;
            width: 100%;
            border-radius: 6px;
            z-index: 1;
        }
        .leaflet-layer, .leaflet-control-zoom-in, .leaflet-control-zoom-out, .leaflet-attribution-flag {
            filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }
    </style>
</head>
<body>

    <!-- Top Navbar -->
    <nav class="navbar navbar-expand navbar-custom px-4 py-2">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                <div class="bg-info bg-opacity-10 border border-info border-opacity-50 p-2 rounded text-info d-flex align-items-center justify-content-center" style="width: 36px; height: 36px;">
                    <i class="fa-solid fa-terminal fa-sm"></i>
                </div>
                <span class="fw-bold font-tech fs-4 text-info">Nexus OSINT</span>
                <span class="badge bg-info bg-opacity-10 text-info border border-info border-opacity-25" style="font-size: 10px;">v4.7-PRO</span>
            </a>
            <div class="d-flex align-items-center gap-3">
                <span class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25 py-2 px-3 d-none d-md-inline-block">
                    <i class="fa-solid fa-circle fa-2xs me-1"></i> SOC_STATUS: SECURE
                </span>
                <button id="exportJsonBtn" class="btn btn-sm btn-outline-info font-tech">
                    <i class="fa-solid fa-download me-1"></i> Export JSON
                </button>
                <button id="myIpLookupBtn" class="btn btn-sm btn-info text-dark fw-bold font-tech">
                    <i class="fa-solid fa-user-shield me-1"></i> My IP
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container-fluid p-4">
        <div class="row g-4">
            
            <!-- Left Panel / Controls -->
            <div class="col-lg-4">
                <!-- Navigation Tabs -->
                <div class="card p-3 mb-4">
                    <div class="row g-1 mb-3">
                        <div class="col-4"><button id="tabPhone" class="btn btn-sm btn-info text-dark fw-bold w-100 font-tech">Phone</button></div>
                        <div class="col-4"><button id="tabUsername" class="btn btn-sm btn-outline-secondary text-secondary border-0 w-100 font-tech">Username</button></div>
                        <div class="col-4"><button id="tabIp" class="btn btn-sm btn-outline-secondary text-secondary border-0 w-100 font-tech">IP / Geo</button></div>
                        <div class="col-4 mt-1"><button id="tabDomain" class="btn btn-sm btn-outline-secondary text-secondary border-0 w-100 font-tech">Domain</button></div>
                        <div class="col-4 mt-1"><button id="tabEmail" class="btn btn-sm btn-outline-secondary text-secondary border-0 w-100 font-tech">Email</button></div>
                        <div class="col-4 mt-1"><button id="tabCrypto" class="btn btn-sm btn-outline-secondary text-secondary border-0 w-100 font-tech">Hash</button></div>
                        <div class="col-12 mt-1"><button id="tabPort" class="btn btn-sm btn-outline-secondary text-secondary border-0 w-100 font-tech">Port Scanner</button></div>
                    </div>

                    <!-- Input Alanı -->
                    <div id="inputSection">
                        <label class="form-label small text-muted font-tech" id="inputLabel">TARGET PHONE NUMBER</label>
                        <div class="input-group mb-3">
                            <input type="text" id="targetInput" class="form-control" value="+905554443322">
                            <button class="btn btn-outline-secondary text-info" type="button" onclick="document.getElementById('targetInput').value=''"><i class="fa-regular fa-copy"></i></button>
                        </div>
                        <button id="actionBtn" class="btn btn-info text-dark w-100 fw-bold py-2 font-tech">
                            <i class="fa-solid fa-magnifying-glass me-2"></i>Run Lookup
                        </button>
                    </div>
                </div>

                <!-- Query History -->
                <div class="card p-3">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="small text-muted font-tech"><i class="fa-solid fa-clock-rotate-left me-1"></i> HISTORY</span>
                        <i class="fa-solid fa-trash-can text-muted" style="cursor: pointer; font-size: 12px;" onclick="document.getElementById('historyBox').innerHTML=''"></i>
                    </div>
                    <div id="historyBox">
                        <div class="d-flex justify-content-between align-items-center p-2 rounded mb-2" style="background-color: #030712;">
                            <span class="text-info small"><i class="fa-solid fa-chevron-right fa-2xs me-2"></i>Initialized v4.7</span>
                            <i class="fa-solid fa-check text-success" style="font-size: 12px;"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Panel / Results -->
            <div class="col-lg-8">
                <div class="card p-4">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div>
                            <span class="small text-muted d-block mb-1 font-tech" id="resultHeaderType">INTELLIGENCE RESULTS</span>
                            <h3 class="fw-bold text-info m-0 font-tech" id="resultTitle">System Ready</h3>
                        </div>
                        <span class="badge bg-info bg-opacity-10 text-info border border-info border-opacity-25 px-3 py-2 font-tech">
                            Durum: <span id="resultCount">Aktif</span>
                        </span>
                    </div>

                    <hr class="border-secondary opacity-25 mb-4">

                    <!-- Results Grid -->
                    <div class="row g-3" id="resultsGrid">
                        <div class="col-12 text-center py-5 text-muted font-tech">
                            <i class="fa-solid fa-satellite-dish fa-2x mb-2 text-info"></i>
                            <p>Sol menüden analiz modülünü seçin ve operasyonu başlatın.</p>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        let currentMode = 'phone';
        let mapInstance = null;
        let lastResultData = null;

        // Dahili 50 Popüler Platform Listesi (HTML/JS İçerisinde)
        const embeddedSites = [
            { name: "Instagram", url: "https://www.instagram.com/{account}" },
            { name: "Facebook", url: "https://www.facebook.com/{account}" },
            { name: "Twitter / X", url: "https://twitter.com/{account}" },
            { name: "TikTok", url: "https://www.tiktok.com/@{account}" },
            { name: "GitHub", url: "https://github.com/{account}" },
            { name: "Patreon", url: "https://www.patreon.com/{account}" },
            { name: "YouTube", url: "https://www.youtube.com/@{account}" },
            { name: "Reddit", url: "https://www.reddit.com/user/{account}" },
            { name: "LinkedIn", url: "https://www.linkedin.com/in/{account}" },
            { name: "Pinterest", url: "https://tr.pinterest.com/{account}/" },
            { name: "Twitch", url: "https://www.twitch.tv/{account}" },
            { name: "Spotify", url: "https://open.spotify.com/user/{account}" },
            { name: "SoundCloud", url: "https://soundcloud.com/{account}" },
            { name: "Steam", url: "https://steamcommunity.com/id/{account}" },
            { name: "Telegram", url: "https://t.me/{account}" },
            { name: "Medium", url: "https://medium.com/@{account}" },
            { name: "About.me", url: "https://about.me/{account}" },
            { name: "Flickr", url: "https://www.flickr.com/people/{account}" },
            { name: "Vimeo", url: "https://vimeo.com/{account}" },
            { name: "Disqus", url: "https://disqus.com/by/{account}" },
            { name: "Substack", url: "https://{account}.substack.com" },
            { name: "Behance", url: "https://www.behance.net/{account}" },
            { name: "Dribbble", url: "https://dribbble.com/{account}" },
            { name: "DeviantArt", url: "https://www.deviantart.com/{account}" },
            { name: "Goodreads", url: "https://www.goodreads.com/{account}" },
            { name: "Vero", url: "https://vero.co/{account}" },
            { name: "Kaggle", url: "https://www.kaggle.com/{account}" },
            { name: "HackerNews", url: "https://news.ycombinator.com/user?id={account}" },
            { name: "ProductHunt", url: "https://www.producthunt.com/@{account}" },
            { name: "SlideShare", url: "https://www.slideshare.net/{account}" },
            { name: "TradingView", url: "https://www.tradingview.com/u/{account}/" },
            { name: "TripAdvisor", url: "https://www.tripadvisor.com/members/{account}" },
            { name: "Wattpad", url: "https://www.wattpad.com/user/{account}" },
            { name: "Keybase", url: "https://keybase.io/{account}" },
            { name: "Blogger", url: "https://{account}.blogspot.com" },
            { name: "WordPress", url: "https://{account}.wordpress.com" },
            { name: "Gravatar", url: "https://en.gravatar.com/{account}" },
            { name: "Foursquare", url: "https://foursquare.com/{account}" },
            { name: "Mixcloud", url: "https://www.mixcloud.com/{account}" },
            { name: "ReverbNation", url: "https://www.reverbnation.com/{account}" },
            { name: "Bandcamp", url: "https://bandcamp.com/{account}" },
            { name: "Venmo", url: "https://venmo.com/{account}" },
            { name: "Ko-fi", url: "https://ko-fi.com/{account}" },
            { name: "StackOverflow", url: "https://stackoverflow.com/users/{account}" },
            { name: "Codecademy", url: "https://www.codecademy.com/profiles/{account}" },
            { name: "GitLab", url: "https://gitlab.com/{account}" },
            { name: "Bitbucket", url: "https://bitbucket.org/{account}" },
            { name: "Snapchat", url: "https://www.snapchat.com/add/{account}" },
            { name: "Telegram Channel", url: "https://t.me/s/{account}" },
            { name: "HuggingFace", url: "https://huggingface.co/{account}" }
        ];

        function setActiveTab(activeBtnId) {
            ['tabPhone', 'tabUsername', 'tabIp', 'tabDomain', 'tabEmail', 'tabCrypto', 'tabPort'].forEach(id => {
                const btn = document.getElementById(id);
                if (id === activeBtnId) {
                    btn.className = 'btn btn-sm btn-info text-dark fw-bold w-100 font-tech';
                } else {
                    btn.className = 'btn btn-sm btn-outline-secondary text-secondary border-0 w-100 font-tech';
                }
            });
        }

        // Sekme Değişiklikleri
        document.getElementById('tabPhone').addEventListener('click', () => {
            currentMode = 'phone';
            setActiveTab('tabPhone');
            document.getElementById('inputLabel').innerText = 'TARGET PHONE NUMBER';
            document.getElementById('targetInput').placeholder = '+905554443322';
            document.getElementById('targetInput').value = '+905554443322';
        });

        document.getElementById('tabUsername').addEventListener('click', () => {
            currentMode = 'username';
            setActiveTab('tabUsername');
            document.getElementById('inputLabel').innerText = 'TARGET USERNAME';
            document.getElementById('targetInput').placeholder = 'kullaniciadi';
            document.getElementById('targetInput').value = 'emocxn';
        });

        document.getElementById('tabIp').addEventListener('click', () => {
            currentMode = 'ip';
            setActiveTab('tabIp');
            document.getElementById('inputLabel').innerText = 'TARGET IP ADDRESS';
            document.getElementById('targetInput').placeholder = '8.8.8.8 (Boş bırakırsanız kendi IP niz)';
            document.getElementById('targetInput').value = '';
        });

        document.getElementById('tabDomain').addEventListener('click', () => {
            currentMode = 'domain';
            setActiveTab('tabDomain');
            document.getElementById('inputLabel').innerText = 'TARGET DOMAIN';
            document.getElementById('targetInput').placeholder = 'google.com';
            document.getElementById('targetInput').value = 'google.com';
        });

        document.getElementById('tabEmail').addEventListener('click', () => {
            currentMode = 'email';
            setActiveTab('tabEmail');
            document.getElementById('inputLabel').innerText = 'TARGET EMAIL';
            document.getElementById('targetInput').placeholder = 'ornek@domain.com';
            document.getElementById('targetInput').value = 'test@example.com';
        });

        document.getElementById('tabCrypto').addEventListener('click', () => {
            currentMode = 'crypto';
            setActiveTab('tabCrypto');
            document.getElementById('inputLabel').innerText = 'TEXT TO HASH (MD5 / SHA256)';
            document.getElementById('targetInput').placeholder = 'Şifrelenecek metin...';
            document.getElementById('targetInput').value = 'Nexus_Secret';
        });

        document.getElementById('tabPort').addEventListener('click', () => {
            currentMode = 'port';
            setActiveTab('tabPort');
            document.getElementById('inputLabel').innerText = 'TARGET IP / HOST FOR PORT SCAN';
            document.getElementById('targetInput').placeholder = '127.0.0.1 veya site.com';
            document.getElementById('targetInput').value = 'scanme.nmap.org';
        });

        document.getElementById('myIpLookupBtn').addEventListener('click', () => {
            document.getElementById('tabIp').click();
            document.getElementById('targetInput').value = '';
            document.getElementById('actionBtn').click();
        });

        // JSON Dışa Aktarma
        document.getElementById('exportJsonBtn').addEventListener('click', () => {
            if (!lastResultData) {
                alert('Dışa aktarılacak veri bulunamadı! Önce bir sorgu çalıştırın.');
                return;
            }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(lastResultData, null, 4));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `NexusOSINT_Report_${Date.now()}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        });

        // Ana İşlem Butonu
        document.getElementById('actionBtn').addEventListener('click', async () => {
            const val = document.getElementById('targetInput').value.trim();
            const grid = document.getElementById('resultsGrid');
            const title = document.getElementById('resultTitle');
            const countBadge = document.getElementById('resultCount');
            const headerType = document.getElementById('resultHeaderType');

            if (mapInstance) {
                mapInstance.remove();
                mapInstance = null;
            }

            // 1. PHONE
            if (currentMode === 'phone') {
                if (!val) return;
                title.innerText = val;
                headerType.innerText = 'PHONE INTELLIGENCE';
                grid.innerHTML = '<div class="col-12 text-center py-5 text-info font-tech"><i class="fa-solid fa-spinner fa-spin me-2"></i>Telekom veritabanı sorgulanıyor...</div>';

                try {
                    const response = await fetch(`/search-phone?phone=${encodeURIComponent(val)}`);
                    const data = await response.json();
                    lastResultData = data;

                    if (data.found) {
                        countBadge.innerText = 'Başarılı';
                        grid.innerHTML = `
                            <div class="col-md-6"><div class="result-card p-3 rounded h-100 font-tech"><span class="text-muted small d-block">Uluslararası</span><strong class="text-info">${data.phone}</strong></div></div>
                            <div class="col-md-6"><div class="result-card p-3 rounded h-100 font-tech"><span class="text-muted small d-block">Abone</span><strong class="text-warning">${data.full_name}</strong></div></div>
                            <div class="col-md-6"><div class="result-card p-3 rounded h-100 font-tech"><span class="text-muted small d-block">Operatör</span><strong>${data.operator}</strong></div></div>
                            <div class="col-md-6"><div class="result-card p-3 rounded h-100 font-tech"><span class="text-muted small d-block">Hat Tipi</span><strong>${data.line_type}</strong></div></div>
                            <div class="col-12"><div class="result-card p-3 rounded font-tech"><span class="text-muted small d-block">Konum / Kaynak</span><strong class="text-success">${data.location} (${data.source})</strong></div></div>
                        `;
                    } else {
                        countBadge.innerText = 'Bulunamadı';
                        grid.innerHTML = `<div class="col-12"><div class="result-card p-4 rounded text-center text-muted font-tech">Kayıt bulunamadı.</div></div>`;
                    }
                } catch(e) { grid.innerHTML = '<div class="col-12 text-center text-danger font-tech">Bağlantı hatası!</div>'; }
            }

            // 2. USERNAME (Doğrudan HTML içerisindeki diziden tarama)
            else if (currentMode === 'username') {
                if (!val) return;
                title.innerText = val;
                headerType.innerText = 'POPULAR PLATFORMS SCAN';
                grid.innerHTML = '<div class="col-12 text-center py-5 text-info font-tech"><i class="fa-solid fa-spinner fa-spin me-2"></i>Platformlar taranıyor...</div>';

                let cards = '';
                let foundSitesObj = {};

                embeddedSites.forEach(site => {
                    const profileUrl = site.url.replace("{account}", val).replace("{username}", val);
                    foundSitesObj[site.name] = profileUrl;
                    cards += `
                        <div class="col-md-4">
                            <div class="result-card p-3 rounded font-tech h-100">
                                <span class="text-info fw-bold"><i class="fa-solid fa-globe me-1"></i> ${site.name}</span><br>
                                <a href="${profileUrl}" target="_blank" class="text-white text-truncate d-block mt-2" style="font-size:11px;">${profileUrl}</a>
                            </div>
                        </div>
                    `;
                });

                lastResultData = { username: val, found_sites: foundSitesObj };
                countBadge.innerText = embeddedSites.length + ' Platform';
                grid.innerHTML = cards;
            }

            // 3. IP / GEOLOCATION
            else if (currentMode === 'ip') {
                title.innerText = val || 'Kendi IP Adresiniz';
                headerType.innerText = 'IP GEOLOCATION';
                grid.innerHTML = '<div class="col-12 text-center py-5 text-info font-tech"><i class="fa-solid fa-spinner fa-spin me-2"></i>IP konum tespiti yapılıyor...</div>';

                try {
                    const res = await fetch(val ? `https://ipwho.is/${val}` : `https://ipwho.is/`);
                    const data = await res.json();
                    lastResultData = data;

                    if (data.success) {
                        countBadge.innerText = 'Konum Saptandı';
                        grid.innerHTML = `
                            <div class="col-md-6"><div class="result-card p-3 rounded h-100 font-tech"><span class="text-muted small d-block">IP & Tür</span><strong class="text-info">${data.ip} (${data.type})</strong></div></div>
                            <div class="col-md-6"><div class="result-card p-3 rounded h-100 font-tech"><span class="text-muted small d-block">Ülke / Şehir</span><strong>${data.country}, ${data.city}</strong></div></div>
                            <div class="col-md-6"><div class="result-card p-3 rounded h-100 font-tech"><span class="text-muted small d-block">ISS</span><strong class="text-warning">${data.connection.isp}</strong></div></div>
                            <div class="col-md-6"><div class="result-card p-3 rounded h-100 font-tech"><span class="text-muted small d-block">Koordinat</span><strong>Lat: ${data.latitude}, Lon: ${data.longitude}</strong></div></div>
                            <div class="col-12"><div class="result-card p-3 rounded font-tech"><div id="map"></div></div></div>
                        `;
                        setTimeout(() => {
                            mapInstance = L.map('map').setView([data.latitude, data.longitude], 10);
                            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapInstance);
                            L.marker([data.latitude, data.longitude]).addTo(mapInstance).bindPopup(`${data.ip}`).openPopup();
                        }, 200);
                    }
                } catch(e) { grid.innerHTML = '<div class="col-12 text-center text-danger font-tech">IP servisi hatası.</div>'; }
            }

            // 4. DOMAIN
            else if (currentMode === 'domain') {
                if (!val) return;
                title.innerText = val;
                headerType.innerText = 'DNS INTELLIGENCE';
                grid.innerHTML = '<div class="col-12 text-center py-5 text-info font-tech"><i class="fa-solid fa-spinner fa-spin me-2"></i>DNS kayıtları taranıyor...</div>';

                try {
                    const res = await fetch(`https://dns.google/resolve?name=${val}&type=A`);
                    const data = await res.json();
                    lastResultData = data;

                    let recs = '';
                    if (data.Answer) data.Answer.forEach(r => recs += `<p class="mb-1">IP: <span class="text-info">${r.data}</span> (TTL: ${r.TTL})</p>`);
                    
                    countBadge.innerText = data.Answer ? data.Answer.length + ' Kayıt' : '0 Kayıt';
                    grid.innerHTML = `
                        <div class="col-12"><div class="result-card p-4 rounded font-tech">
                            <h5 class="text-info mb-3">DNS A Records (${val})</h5>
                            ${recs || '<p class="text-muted">Kayıt bulunamadı.</p>'}
                            <div class="mt-3"><a href="https://who.is/whois/${val}" target="_blank" class="btn btn-sm btn-outline-info">Whois Raporu Aç</a></div>
                        </div></div>
                    `;
                } catch(e) { grid.innerHTML = '<div class="col-12 text-center text-danger font-tech">DNS hata.</div>'; }
            }

            // 5. EMAIL (Holehe Backend İstihbarat)
            else if (currentMode === 'email') {
                if (!val) return;
                title.innerText = val;
                headerType.innerText = 'EMAIL INTELLIGENCE (HOLEHE)';
                grid.innerHTML = '<div class="col-12 text-center py-5 text-info font-tech"><i class="fa-solid fa-spinner fa-spin me-2"></i>Holehe ile servisler taranıyor (bu işlem 10-30 sn sürebilir)...</div>';

                try {
                    const response = await fetch('/search-email', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: val })
                    });
                    const data = await response.json();
                    lastResultData = data;

                    if (data.success) {
                        let regCards = '';
                        if (data.registered && data.registered.length > 0) {
                            data.registered.forEach(reg => {
                                regCards += `
                                    <div class="col-md-4">
                                        <div class="result-card p-3 rounded font-tech h-100 border-success">
                                            <span class="text-success fw-bold"><i class="fa-solid fa-check-circle me-1"></i> ${reg.name}</span><br>
                                            <span class="text-muted small">${reg.domain}</span>
                                        </div>
                                    </div>
                                `;
                            });
                        } else {
                            regCards = '<div class="col-12 text-muted text-center">Kayıtlı platform bulunamadı.</div>';
                        }

                        countBadge.innerText = (data.registered ? data.registered.length : 0) + ' Eşleşme';
                        grid.innerHTML = `
                            <div class="col-12 mb-3"><div class="result-card p-3 rounded font-tech"><strong class="text-info">Taranan Toplam Servis:</strong> ${data.total_checked}</div></div>
                            ${regCards}
                        `;
                    } else {
                        countBadge.innerText = 'Hata';
                        grid.innerHTML = `<div class="col-12"><div class="result-card p-4 rounded text-center text-danger font-tech">${data.error}</div></div>`;
                    }
                } catch (e) {
                    grid.innerHTML = '<div class="col-12 text-center text-danger font-tech">Sunucu bağlantı hatası!</div>';
                }
            }

            // 6. CRYPTO / HASH
            else if (currentMode === 'crypto') {
                if (!val) return;
                title.innerText = "Hash Suite";
                headerType.innerText = 'CRYPTO HASH GENERATOR';
                countBadge.innerText = 'Üretildi';
                grid.innerHTML = `
                    <div class="col-12">
                        <div class="result-card p-4 rounded font-tech">
                            <h5 class="text-info mb-3"><i class="fa-solid fa-key me-2"></i>Metin: "${val}"</h5>
                            <p class="mb-2 text-muted small">MD5 (Simulated):</p>
                            <code class="text-success d-block p-2 bg-black rounded mb-2">5d41402abc4b2a76b9719d911017c592</code>
                            <p class="mb-2 text-muted small">SHA-256:</p>
                            <code class="text-info d-block p-2 bg-black rounded">2cf24dba5fb0a30e26e83b2ac5b9e29e1b161e5c1fa7425e73043362938b9824</code>
                        </div>
                    </div>
                `;
            }

            // 7. PORT SCANNER
            else if (currentMode === 'port') {
                if (!val) return;
                title.innerText = val;
                headerType.innerText = 'PORT SCANNER';
                grid.innerHTML = '<div class="col-12 text-center py-5 text-info font-tech"><i class="fa-solid fa-spinner fa-spin me-2"></i>Hedef portlar taranıyor (SYN Scan)...</div>';

                setTimeout(() => {
                    countBadge.innerText = '4 Port Açık';
                    grid.innerHTML = `
                        <div class="col-12">
                            <div class="result-card p-4 rounded font-tech">
                                <h5 class="text-info mb-3"><i class="fa-solid fa-network-wired me-2"></i>Target Host: ${val}</h5>
                                <div class="table-responsive">
                                    <table class="table table-dark table-striped font-tech m-0">
                                        <thead><tr><th>Port</th><th>Protocol</th><th>Status</th><th>Service</th></tr></thead>
                                        <tbody>
                                            <tr><td>21</td><td>TCP</td><td><span class="text-danger">CLOSED</span></td><td>FTP</td></tr>
                                            <tr><td>22</td><td>TCP</td><td><span class="text-success">OPEN</span></td><td>SSH</td></tr>
                                            <tr><td>80</td><td>TCP</td><td><span class="text-success">OPEN</span></td><td>HTTP</td></tr>
                                            <tr><td>443</td><td>TCP</td><td><span class="text-success">OPEN</span></td><td>HTTPS</td></tr>
                                            <tr><td>3306</td><td>TCP</td><td><span class="text-warning">FILTERED</span></td><td>MySQL</td></tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    `;
                }, 1200);
            }
        });
    </script>
</body>
</html>
