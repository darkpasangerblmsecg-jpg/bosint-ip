<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRYPTA OSINT</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glow-effect { box-shadow: 0 0 25px rgba(59, 130, 246, 0.15); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-blue-500 selection:text-white">

    <!-- Üst Bilgi Çubuğu (Header) -->
    <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600/20 border border-blue-500/30 p-2 rounded-xl text-blue-400">
                    <i class="fa-solid fa-shield-halved text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg tracking-wide bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">CRYPTA OSINT</h1>
                    <p class="text-xs text-slate-400">Gelişmiş Tehdit ve İstihbarat Analiz Sistemi</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                    <span class="w-2 h-2 mr-1.5 bg-emerald-500 rounded-full animate-pulse"></span> Sistem Aktif
                </span>
            </div>
        </div>
    </header>

    <!-- Ana İçerik Alanı -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Sol Panel: Modül Seçimi ve Giriş Formu -->
        <div class="lg:col-span-4 space-y-6">
            <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 glow-effect">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-4 flex items-center">
                    <i class="fa-solid fa-cubes mr-2 text-blue-500"></i> İstihbarat Modülleri
                </h2>

                <!-- Sekme Butonları -->
                <div class="grid grid-cols-3 gap-2 mb-5">
                    <button onclick="switchTab('phone')" id="btn-phone" class="tab-btn px-3 py-2.5 rounded-xl text-xs font-medium bg-blue-600 text-white transition-all flex flex-col items-center justify-center space-y-1">
                        <i class="fa-solid fa-phone text-sm"></i> <span>Telefon</span>
                    </button>
                    <button onclick="switchTab('username')" id="btn-username" class="tab-btn px-3 py-2.5 rounded-xl text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all flex flex-col items-center justify-center space-y-1">
                        <i class="fa-solid fa-user text-sm"></i> <span>Kullanıcı</span>
                    </button>
                    <button onclick="switchTab('email')" id="btn-email" class="tab-btn px-3 py-2.5 rounded-xl text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all flex flex-col items-center justify-center space-y-1">
                        <i class="fa-solid fa-envelope text-sm"></i> <span>E-posta</span>
                    </button>
                    <button onclick="switchTab('ip')" id="btn-ip" class="tab-btn px-3 py-2.5 rounded-xl text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all flex flex-col items-center justify-center space-y-1">
                        <i class="fa-solid fa-network-wired text-sm"></i> <span>IP / Geo</span>
                    </button>
                    <button onclick="switchTab('domain')" id="btn-domain" class="tab-btn px-3 py-2.5 rounded-xl text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all flex flex-col items-center justify-center space-y-1">
                        <i class="fa-solid fa-globe text-sm"></i> <span>Domain</span>
                    </button>
                    <button onclick="switchTab('hash')" id="btn-hash" class="tab-btn px-3 py-2.5 rounded-xl text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all flex flex-col items-center justify-center space-y-1">
                        <i class="fa-solid fa-fingerprint text-sm"></i> <span>Hash</span>
                    </button>
                </div>

                <!-- Sorgu Formu -->
                <form id="osint-form" onsubmit="handleSearch(event)" class="space-y-4">
                    <input type="hidden" id="active-module" value="phone">
                    <div>
                        <label id="input-label" class="block text-xs font-medium text-slate-300 mb-1.5">Telefon Numarası (Örn: +90555...)</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
                                <i id="input-icon" class="fa-solid fa-phone"></i>
                            </span>
                            <input type="text" id="query-input" required placeholder="+905551234567" 
                                class="w-full pl-10 pr-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 mono">
                        </div>
                    </div>
                    <button type="submit" id="submit-btn" class="w-full py-3 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white rounded-xl font-medium text-sm shadow-lg shadow-blue-600/20 transition-all flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <span>Analizi Başlat</span>
                    </button>
                </form>
            </div>
        </div>

        <!-- Sağ Panel: Sonuçlar ve Veri Akışı -->
        <div class="lg:col-span-8 space-y-6">
            <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 min-h-[500px] flex flex-col justify-between">
                
                <!-- Üst Bilgi / Sayaçlar -->
                <div>
                    <div class="flex items-center justify-between pb-4 border-b border-slate-800 mb-4">
                        <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 flex items-center">
                            <i class="fa-solid fa-terminal mr-2 text-blue-500"></i> Analiz Sonuçları
                        </h2>
                        <div id="result-meta" class="text-xs text-slate-400 hidden">
                            Bulunan Kayıt: <span id="record-count" class="text-blue-400 font-bold">0</span>
                        </div>
                    </div>

                    <!-- Varsayılan / Yükleniyor Durumu -->
                    <div id="empty-state" class="flex flex-col items-center justify-center py-20 text-center">
                        <div class="w-16 h-16 bg-slate-800/50 rounded-2xl flex items-center justify-center text-slate-600 mb-4 border border-slate-800">
                            <i class="fa-solid fa-radar text-2xl"></i>
                        </div>
                        <p class="text-slate-400 text-sm">Henüz bir arama gerçekleştirilmedi.</p>
                        <p class="text-slate-600 text-xs mt-1">Sol panelden modül seçip sorgu başlatın.</p>
                    </div>

                    <div id="loading-state" class="hidden flex flex-col items-center justify-center py-20 text-center">
                        <div class="w-12 h-12 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                        <p class="text-slate-300 text-sm font-medium">İstihbarat verileri taranıyor...</p>
                        <p class="text-slate-500 text-xs mt-1">Kaynaklar sorgulanıyor, lütfen bekleyin.</p>
                    </div>

                    <!-- Sonuçların Listelendiği Alan -->
                    <div id="results-container" class="hidden space-y-3">
                        <!-- Dinamik kartlar buraya eklenecek -->
                    </div>
                </div>

                <!-- Alt İşlem Butonları -->
                <div id="result-actions" class="hidden pt-4 border-t border-slate-800 flex justify-end space-x-3">
                    <button onclick="exportJSON()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-medium transition-all flex items-center space-x-2">
                        <i class="fa-solid fa-download"></i>
                        <span>JSON İndir</span>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- JavaScript İşlevselliği -->
    <script>
        let lastResultData = null;

        const moduleConfigs = {
            phone: { label: "Telefon Numarası (Örn: +90555...)", placeholder: "+905551234567", icon: "fa-phone" },
            username: { label: "Kullanıcı Adı (Target Username)", placeholder: "johndoe", icon: "fa-user" },
            email: { label: "E-posta Adresi", placeholder: "target@domain.com", icon: "fa-envelope" },
            ip: { label: "IP Adresi veya Host", placeholder: "8.8.8.8", icon: "fa-network-wired" },
            domain: { label: "Domain Adı", placeholder: "example.com", icon: "fa-globe" },
            hash: { label: "Dosya Hash Değeri (MD5/SHA256)", placeholder: "5d41402abc4b2a76b9719d911017c592", icon: "fa-fingerprint" }
        };

        function switchTab(module) {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = "tab-btn px-3 py-2.5 rounded-xl text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition-all flex flex-col items-center justify-center space-y-1";
            });
            const activeBtn = document.getElementById(`btn-${module}`);
            activeBtn.className = "tab-btn px-3 py-2.5 rounded-xl text-xs font-medium bg-blue-600 text-white transition-all flex flex-col items-center justify-center space-y-1";

            document.getElementById('active-module').value = module;
            document.getElementById('input-label').innerText = moduleConfigs[module].label;
            document.getElementById('query-input').placeholder = moduleConfigs[module].placeholder;
            document.getElementById('input-icon').className = `fa-solid ${moduleConfigs[module].icon}`;
        }

        async function handleSearch(event) {
            event.preventDefault();
            const module = document.getElementById('active-module').value;
            const query = document.getElementById('query-input').value.trim();

            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('results-container').classList.add('hidden');
            document.getElementById('result-meta').classList.add('hidden');
            document.getElementById('result-actions').classList.add('hidden');
            document.getElementById('loading-state').classList.remove('hidden');

            try {
                let response, data;

                if (module === 'phone') {
                    response = await fetch(`/search-phone?phone=${encodeURIComponent(query)}`);
                    data = await response.json();
                    lastResultData = data;
                    renderPhoneResults(data);
                } else if (module === 'username') {
                    response = await fetch(`/search?username=${encodeURIComponent(query)}`);
                    data = await response.json();
                    lastResultData = data;
                    renderUsernameResults(data);
                } else if (module === 'email') {
                    response = await fetch('/search-email', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email: query })
                    });
                    data = await response.json();
                    lastResultData = data;
                    renderEmailResults(data);
                } else {
                    setTimeout(() => {
                        const mockData = { results: [{ platform: "Genel Bilgi", details: `${module.toUpperCase()} modülü için simülasyon sonuç: ${query}`, url: "" }] };
                        lastResultData = mockData;
                        renderGenericResults(mockData);
                    }, 600);
                }
            } catch (error) {
                console.error("Hata:", error);
                document.getElementById('loading-state').classList.add('hidden');
                alert("Sunucu bağlantısı sırasında bir hata oluştu.");
            }
        }

        function renderPhoneResults(data) {
            document.getElementById('loading-state').classList.add('hidden');
            const container = document.getElementById('results-container');
            container.innerHTML = '';

            if (!data.found) {
                container.innerHTML = `<div class="text-center py-10 text-slate-500 text-sm">${data.message || 'Kayıt bulunamadı.'}</div>`;
            } else {
                document.getElementById('record-count').innerText = "1";
                document.getElementById('result-meta').classList.remove('hidden');
                document.getElementById('result-actions').classList.remove('hidden');

                container.innerHTML = `
                    <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-4 space-y-2">
                        <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                            <span class="text-xs font-semibold text-blue-400">${data.source || 'Telefon İstihbaratı'}</span>
                            <span class="text-xs bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded border border-emerald-500/20">${data.line_type}</span>
                        </div>
                        <div class="grid grid-cols-2 gap-2 text-xs pt-1">
                            <div><span class="text-slate-500">Ad / Statü:</span> <span class="text-slate-200 font-medium">${data.full_name}</span></div>
                            <div><span class="text-slate-500">Operatör:</span> <span class="text-slate-200 font-medium">${data.operator}</span></div>
                            <div><span class="text-slate-500">Lokasyon:</span> <span class="text-slate-200 font-medium">${data.location}</span></div>
                            <div><span class="text-slate-500">Zaman Dilimi:</span> <span class="text-slate-200 font-medium">${data.timezone}</span></div>
                        </div>
                    </div>
                `;
            }
            container.classList.remove('hidden');
        }

        function renderUsernameResults(data) {
            document.getElementById('loading-state').classList.add('hidden');
            const container = document.getElementById('results-container');
            container.innerHTML = '';

            const sites = data.found_sites || {};
            const keys = Object.keys(sites);

            document.getElementById('record-count').innerText = keys.length;
            document.getElementById('result-meta').classList.remove('hidden');
            document.getElementById('result-actions').classList.remove('hidden');

            if (keys.length === 0) {
                container.innerHTML = '<div class="text-center py-10 text-slate-500 text-sm">Eşleşen platform bulunamadı.</div>';
            } else {
                keys.forEach(site => {
                    const url = sites[site];
                    container.innerHTML += `
                        <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-4 flex items-center justify-between hover:border-slate-700 transition-all">
                            <div class="flex items-center space-x-3">
                                <div class="w-8 h-8 rounded-lg bg-blue-500/10 text-blue-400 flex items-center justify-center">
                                    <i class="fa-solid fa-check text-xs"></i>
                                </div>
                                <div>
                                    <h4 class="text-sm font-semibold text-slate-200 capitalize">${site}</h4>
                                    <p class="text-xs text-slate-400 mono mt-0.5">${url}</p>
                                </div>
                            </div>
                            <a href="${url}" target="_blank" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-blue-400 rounded-lg text-xs font-medium transition-all flex items-center space-x-1">
                                <span>Git</span><i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                            </a>
                        </div>
                    `;
                });
            }
            container.classList.remove('hidden');
        }

        function renderEmailResults(data) {
            document.getElementById('loading-state').classList.add('hidden');
            const container = document.getElementById('results-container');
            container.innerHTML = '';

            if (!data.success) {
                container.innerHTML = `<div class="text-center py-10 text-red-400 text-sm">${data.error || 'Tarama başarısız oldu.'}</div>`;
                container.classList.remove('hidden');
                return;
            }

            const registered = data.registered || [];
            document.getElementById('record-count').innerText = registered.length;
            document.getElementById('result-meta').classList.remove('hidden');
            document.getElementById('result-actions').classList.remove('hidden');

            if (registered.length === 0) {
                container.innerHTML = '<div class="text-center py-10 text-slate-500 text-sm">Bu e-posta ile kayıtlı servis bulunamadı.</div>';
            } else {
                registered.forEach(item => {
                    container.innerHTML += `
                        <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-4 flex items-center justify-between hover:border-slate-700 transition-all">
                            <div class="flex items-center space-x-3">
                                <div class="w-8 h-8 rounded-lg bg-emerald-500/10 text-emerald-400 flex items-center justify-center">
                                    <i class="fa-solid fa-shield-check text-xs"></i>
                                </div>
                                <div>
                                    <h4 class="text-sm font-semibold text-slate-200">${item.name}</h4>
                                    <p class="text-xs text-slate-400 mono mt-0.5">${item.domain || ''}</p>
                                </div>
                            </div>
                            <span class="px-2.5 py-1 bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 rounded-lg text-xs font-medium">Kayıtlı</span>
                        </div>
                    `;
                });
            }
            container.classList.remove('hidden');
        }

        function renderGenericResults(data) {
            document.getElementById('loading-state').classList.add('hidden');
            const container = document.getElementById('results-container');
            container.innerHTML = '';
            const results = data.results || [];
            document.getElementById('record-count').innerText = results.length;
            document.getElementById('result-meta').classList.remove('hidden');
            document.getElementById('result-actions').classList.remove('hidden');

            results.forEach(item => {
                container.innerHTML += `
                    <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-4 flex items-center justify-between">
                        <div>
                            <h4 class="text-sm font-semibold text-slate-200">${item.platform}</h4>
                            <p class="text-xs text-slate-400 mono mt-0.5">${item.details}</p>
                        </div>
                    </div>
                `;
            });
            container.classList.remove('hidden');
        }

        function exportJSON() {
            if (!lastResultData) {
                alert("İndirilecek veri bulunmuyor.");
                return;
            }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(lastResultData, null, 4));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "crypta_osint_report.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }
    </script>
</body>
</html>
